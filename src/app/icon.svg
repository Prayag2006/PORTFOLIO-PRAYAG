  <path fill="#F5F1E8" fill-rule="evenodd"
        d="M20,12 H39 A6,6 0 0 1 45,18 V30 A6,6 0 0 1 39,36 H27.5 V52 H20 Z
           M27.5,19.5 H34.5 A3,3 0 0 1 37.5,22.5 V25.5 A3,3 0 0 1 34.5,28.5 H27.5 Z"/>
</svg>

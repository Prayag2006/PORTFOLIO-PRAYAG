<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Prayag Kansara">
  <!-- The hero disc carrying a "P" in the Bebas idiom of the wordmark:
       condensed, flat terminals, uniform stroke. Drawn as a path rather than
       set in Bebas Neue because favicons render with no webfonts available.
       Weight is tuned for 16px — any lighter and the counter fills in. -->
